<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../lesson.css">
    <link rel="stylesheet" href="../theme.css">
    <title>Multimedia Self Practice</title>
</head>
<body>
    <header>
        <p><a href="index.html">Back to HTML multimedia</a></p>
        <h1>Multimedia Self Practice</h1>
    </header>
    <main>
        <article>
            <h2>One page with different media</h2>
            <p>This practice post combines a photo, audio, and video with text.</p>
            <figure>
                <img src="Images/welcome_pic.jpg" alt="Image used as a multimedia practice example" width="500">
                <figcaption>Image example.</figcaption>
            </figure>
            <section>
                <h3>Audio</h3>
                <audio src="Music/See_You_Again.mp3" controls preload="metadata">
                    Audio playback is not supported by this browser.
                </audio>
            </section>
            <section>
                <h3>Video</h3>
                <figure>
                    <video src="Video/VID-20260501-WA0014.mp4" width="500" controls preload="metadata">
                        Video playback is not supported by this browser.
                    </video>
                    <figcaption>Video example.</figcaption>
                </figure>
            </section>
        </article>
    </main>
    <script src="../theme.js" defer></script>
</body>
</html>
