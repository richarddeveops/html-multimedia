<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../lesson.css">
    <link rel="stylesheet" href="../theme.css">
    <title>Multimedia Classwork</title>
</head>
<body>
    <header>
        <p><a href="index.html">Back to HTML multimedia</a></p>
        <h1>Multimedia Classwork</h1>
    </header>
    <main>
        <article>
            <h2>Example blog post</h2>
            <p>This sample page demonstrates how a blog can include text, an image, audio, and video.</p>
            <figure>
                <img src="Images/photo_5866054251593798045_w.jpg" alt="Photograph used for the multimedia class exercise" width="500">
                <figcaption>Example image and caption.</figcaption>
            </figure>
            <section>
                <h3>Audio example</h3>
                <audio src="Music/See_You_Again.mp3" controls preload="metadata">
                    Audio playback is not supported by this browser.
                </audio>
            </section>
            <section>
                <h3>Video example</h3>
                <figure>
                    <video src="Video/2e7c1bc5-8538-4f64-b279-90fd45396b55.mp4" width="500" controls preload="metadata">
                        Video playback is not supported by this browser.
                    </video>
                    <figcaption>Local video used for the lesson.</figcaption>
                </figure>
            </section>
        </article>
    </main>
    <script src="../theme.js" defer></script>
</body>
</html>
